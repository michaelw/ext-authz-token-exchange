name: smoke

on:
  schedule:
    - cron: "29 8 * * *"
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Smoke ext-authz
            mode: ext-authz
            cluster: ext-authz
          - check: Smoke ext-proc
            mode: ext-proc
            cluster: ext-proc
          - check: Smoke InferencePool Istio 1.28.0
            mode: ext-proc-inferencepool
            istio: 1.28.0
            cluster: inferencepool-1280
          - check: Smoke InferencePool Istio 1.31.3
            mode: ext-proc-inferencepool
            istio: 1.31.3
            cluster: inferencepool-1313

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up shared smoke tooling
        uses: ./.github/actions/setup-toolchain
        with:
          target: smoke-toolchain

      - name: Run smoke (${{ matrix.mode }})
        env:
          SMOKE_MODE: ${{ matrix.mode }}
          SMOKE_ISTIO_VERSION: ${{ matrix.istio }}
          SMOKE_CLUSTER_NAME: txe-smoke-${{ matrix.cluster }}
        run: |
          docker run --rm --user 0:0 --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:$PWD" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -v "$HOME/.cache/txe-go:/go-cache" -w "$PWD" \
            -e TMPDIR="$RUNNER_TEMP" -e SMOKE_MODE -e SMOKE_ISTIO_VERSION -e SMOKE_CLUSTER_NAME \
            txe-smoke-toolchain:ci sh -c 'git config --global --add safe.directory "$PWD" && go generate ./... && go run ./test/e2e/cmd/smoke'
