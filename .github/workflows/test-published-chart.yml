name: Test Published Chart

on:
  workflow_dispatch:
    inputs:
      version:
        description: Chart version to test, without a leading v.
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CHART_NAME: ext-authz-token-exchange
  CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
  CHART_VERSION: ${{ inputs.version }}

jobs:
  test-published-chart:
    name: Test published chart
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up shared smoke tooling
        uses: ./.github/actions/setup-toolchain
        with:
          target: smoke-toolchain

      - name: Validate published chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.actor }}
        run: |
          docker run --rm --user 0:0 \
            -v "$PWD:$PWD" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" \
            -e GITHUB_TOKEN -e GITHUB_USERNAME -e GITHUB_REF_TYPE -e GITHUB_REF_NAME \
            -e CHART_VERSION -e CHART_REGISTRY -e CHART_NAME -e RUNNER_TEMP \
            txe-smoke-toolchain:ci bash -euc '
              [[ "$CHART_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
              [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == "v$CHART_VERSION" ]]
              printf "%s" "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_USERNAME" --password-stdin
              mkdir -p "$RUNNER_TEMP/chart-package"
              helm pull "$CHART_REGISTRY/$CHART_NAME" --version "$CHART_VERSION" --destination "$RUNNER_TEMP/chart-package"
              package="$RUNNER_TEMP/chart-package/$CHART_NAME-$CHART_VERSION.tgz"
              test -s "$package"
              helm show chart "$package"
              helm show values "$package"
            '

      - name: Install and test published chart
        env:
          SMOKE_MODE: ext-proc-inferencepool
          SMOKE_ISTIO_VERSION: 1.31.3
          SMOKE_CLUSTER_NAME: txe-published-chart
          SMOKE_CHART_VERSION: ${{ inputs.version }}
          SMOKE_CHART_PACKAGE: ${{ runner.temp }}/chart-package/ext-authz-token-exchange-${{ inputs.version }}.tgz
        run: |
          docker run --rm --user 0:0 --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:$PWD" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -v "$HOME/.cache/txe-go:/go-cache" -w "$PWD" \
            -e TMPDIR="$RUNNER_TEMP" -e SMOKE_MODE -e SMOKE_ISTIO_VERSION -e SMOKE_CLUSTER_NAME \
            -e SMOKE_CHART_VERSION -e SMOKE_CHART_PACKAGE \
            txe-smoke-toolchain:ci sh -c 'git config --global --add safe.directory "$PWD" && go generate ./... && go run ./test/e2e/cmd/smoke'
