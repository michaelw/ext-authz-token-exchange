name: Shared tooling container
description: Build the same pinned tooling image used for local checks.
inputs:
  target:
    description: Dockerfile tooling target.
    default: toolchain
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Restore compiler and check caches
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/txe-go
          ~/.cache/pre-commit
        key: checks-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ github.job }}-${{ hashFiles('go.sum', 'Dockerfile', '.pre-commit-config.yaml') }}-${{ github.run_id }}
        restore-keys: |
          checks-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ github.job }}-${{ hashFiles('go.sum', 'Dockerfile', '.pre-commit-config.yaml') }}-
    - name: Prepare cache directories
      shell: bash
      run: mkdir -p "$HOME/.cache/txe-go" "$HOME/.cache/pre-commit"
    - name: Build pinned tooling
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: ${{ inputs.target }}
        push: false
        load: true
        tags: txe-${{ inputs.target }}:ci
        cache-from: |
          type=gha,scope=tools-main-${{ inputs.target }}
          type=gha,scope=tools-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}-${{ inputs.target }}
        cache-to: type=gha,mode=max,scope=tools-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}-${{ inputs.target }}
