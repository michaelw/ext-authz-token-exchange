name: Setup Helm
description: Install the Helm version used by repository workflows.

inputs:
  version:
    description: Helm version to install.
    required: false
    default: v4.1.1

runs:
  using: composite
  steps:
    - name: Set up Helm
      uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      with:
        version: ${{ inputs.version }}
