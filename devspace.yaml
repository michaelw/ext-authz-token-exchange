version: v2beta1
name: ext-authz-token-exchange
dependencies: {}

require:
  commands:
    - name: yq
      versionArgs: ["--version"]
      versionRegEx: "yq \\(https://github.com/mikefarah/yq/\\) version (v\\d+\\.\\d+\\.\\d+)"
      version: ">= 4"

# Variables for configuration
vars:
  DEVSPACE_USER: $(tr -d '._' <<< ${USER:-$(whoami)})
  CONTAINER_USER_HOME: /home/devuser
  DNS_DOMAIN:
    value: kube
  GKE_DNS_DOMAIN:
    value: gcp.kube
  DNS_MODE:
    value: local
  DNS_SERVICE_ID:
    value: kube
  GKE_DNS_ZONE:
    value: ""
  GKE_PROJECT_ID:
    command: ./scripts/starter-pack-env.sh
    args: ["get", "GKE_PROJECT_ID", "", "${DEVSPACE_CONTEXT}"]
  GKE_REGION:
    command: ./scripts/starter-pack-env.sh
    args: ["get", "GKE_REGION", "", "${DEVSPACE_CONTEXT}"]
  GKE_GATEWAY_NAMESPACE:
    value: gke-gateway
  GKE_GATEWAY_NAME:
    command: python3 scripts/gateway.py value --key gateway_name --default gateway
  GKE_GATEWAY_SECTION_NAME:
    value: https
  GKE_EXTERNAL_SCHEME:
    value: https
  GKE_GATEWAY_IP:
    value: ""
  GKE_DEPLOYMENT_DOMAIN:
    value: ""
  GKE_HTTPBIN_HOST:
    value: httpbin.${GKE_DEPLOYMENT_DOMAIN}
  GKE_KEYCLOAK_HOST:
    value: keycloak.${GKE_DEPLOYMENT_DOMAIN}
  GKE_PLATFORM_NAMESPACE:
    value: txe-platform
  GKE_PLATFORM_TEAMS:
    value: yellow,red,blue,green
  GKE_TEAM_NAMESPACE_PREFIX:
    value: txe-team
  GKE_DEMO_NAMESPACE_PREFIX:
    value: txe-demo
  GKE_TEAM_PATH_ROOT:
    value: /anything/txe
  GKE_TEAM_NAME:
    value: yellow
  GKE_TEAM_NAMESPACE:
    value: ${GKE_TEAM_NAMESPACE_PREFIX}-${GKE_TEAM_NAME}
  GKE_IMAGE_TAG:
    command: yq
    args: ["-r", ".appVersion", "charts/ext-authz-token-exchange/Chart.yaml"]
  DNS_NAMESERVERS:
    value: ""
  HOST_INTEGRATION:
    value: "true"
  GATEWAY_PROVIDER:
    command: ./scripts/starter-pack-env.sh
    args: ["gateway-provider", "${DEVSPACE_CONTEXT}"]
  DEPLOYMENT_DOMAIN:
    command: ./scripts/starter-pack-env.sh
    args: ["get", "DEPLOYMENT_DOMAIN", "int.kube", "${DEVSPACE_CONTEXT}"]
  GATEWAY_NAMESPACE:
    command: ./scripts/starter-pack-env.sh
    args: ["get", "GATEWAY_NAMESPACE", "gke-gateway", "${DEVSPACE_CONTEXT}"]
  DEV_REGISTRY_IMAGE_PREFIX:
    command: ./scripts/starter-pack-env.sh
    args: ["get", "DEV_REGISTRY_IMAGE_PREFIX", "", "${DEVSPACE_CONTEXT}"]
  REGISTRY:
    command: ./scripts/starter-pack-env.sh
    args: ["get", "REGISTRY", "ghcr.io/michaelw", "${DEVSPACE_CONTEXT}"]
  DEV_REGISTRY:
    command: ./scripts/starter-pack-env.sh
    args: ["get", "DEV_REGISTRY", "ghcr.io/michaelw", "${DEVSPACE_CONTEXT}"]
  IMAGE_NAME:
    value: "ext-authz-token-exchange"
  FAKE_TOKEN_ENDPOINT_IMAGE_NAME:
    value: "ext-authz-token-exchange-fake-token-endpoint"
  IMAGE_TAG:
    command: python3 scripts/gateway.py image-tag
  DEV_TAG:
    value: "${IMAGE_TAG}-${DEVSPACE_USER}"
  PROD_TAG:
    value: "latest" # XXX versioning scheme for production images
  APIGEE_NAMESPACE:
    command: python3 scripts/gateway.py value --key plugin_namespace --default txe-apigee
  GKE_MANAGE_GATEWAY:
    command: python3 scripts/gateway.py value --key manage_gateway --default false
  KEYCLOAK_ENABLED:
    command: python3 scripts/gateway.py value --key keycloak_enabled --default false
  GATEWAY_SETUP_PROVIDER:
    command: python3 scripts/gateway.py value --key gateway --default none
  APIGEE_RELEASE:
    command: python3 scripts/gateway.py value --key plugin_release --default txe-apigee
  APIGEE_SYSTEM_NAMESPACE:
    command: python3 scripts/gateway.py value --key system_namespace --default txe-apigee-system
  APIGEE_PLUGIN_VALUES:
    command: python3 scripts/gateway.py value --key plugin_values --default .devspace/apigee-plugin-values.json
  APIGEE_DEMO_VALUES:
    command: python3 scripts/gateway.py value --key demo_values --default .devspace/apigee-demo-values.json
  APIGEE_KEYCLOAK_VALUES:
    command: python3 scripts/gateway.py value --key keycloak_values --default .devspace/apigee-keycloak-values.json
  APIGEE_DEMO_RELEASE:
    command: python3 scripts/gateway.py value --key demo_release --default txe-apigee-demo
  APIGEE_KEYCLOAK_RELEASE:
    command: python3 scripts/gateway.py value --key keycloak_release --default txe-apigee-keycloak
  APIGEE_FIXTURES_DISABLED:
    command: python3 scripts/gateway.py value --key fixtures_disabled --default true
  APIGEE_KEYCLOAK_DISABLED:
    command: python3 scripts/gateway.py value --key keycloak_disabled --default true
profiles:
  - name: with-infra
    patches:
      - op: replace
        path: dependencies
        value: $(python3 scripts/gateway.py dependency --selected "${GATEWAY_SETUP_PROVIDER}")
  - name: with-infra-smoke
    patches:
      - op: replace
        path: dependencies
        value: $(python3 scripts/gateway.py dependency --selected "${GATEWAY_SETUP_PROVIDER}" --local-path "${SMOKE_INFRA_PATH}")
  - name: with-test
    activation:
      - vars:
          DEVSPACE_CONTEXT: .+
    merge:
      deployments:
        ext-authz-token-exchange:
          helm:
            values:
              gatewayProvider: ${GATEWAY_PROVIDER}
              envoyFilter:
                enabled: false
              gkeAuthz:
                gateway:
                  name: ${GKE_GATEWAY_NAME}
                  namespace: ${GATEWAY_NAMESPACE}
                host: httpbin.${DEPLOYMENT_DOMAIN}
                callout:
                  tls:
                    certificate:
                      dnsNames:
                        - gateway-ext-authz.${GATEWAY_NAMESPACE}.svc.cluster.local
              gkeExtProc:
                host: httpbin.${DEPLOYMENT_DOMAIN}
                gateway:
                  name: ${GKE_GATEWAY_NAME}
              grafanaDashboard:
                enabled: true
                providerCluster: outbound|3001||gateway-ext-authz.istio-ingress.svc.cluster.local
              env:
                TOKEN_EXCHANGE_ALLOW_HTTP_TOKEN_ENDPOINT: "true"
                TOKEN_EXCHANGE_BEARER_REALM: ext-authz-token-exchange-e2e
                # Enable explicitly only when debugging synthetic test tokens.
                TOKEN_EXCHANGE_INSECURE_LOG_TOKENS: "false"
              oauth:
                createSecret: true
                secretName: ext-authz-token-exchange-fake-issuer-oauth
                clientID: e2e-client
                clientSecret: e2e-secret
                existingSecret:
                  name: ext-authz-token-exchange-fake-issuer-oauth
                  clientIDKey: client_id
                  clientSecretKey: client_secret
              issuerProfiles:
                profiles:
                  - name: fake-issuer
                    tokenEndpoint: http://fake-token-endpoint.ext-authz-token-exchange-e2e.svc.cluster.local:8080/token/success
                    bearerRealm: ext-authz-token-exchange-e2e
                    tokenEndpointAuthMethod: client_secret_basic
                    clientIDSecretRef:
                      name: ext-authz-token-exchange-fake-issuer-oauth
                      key: client_id
                    clientSecretSecretRef:
                      name: ext-authz-token-exchange-fake-issuer-oauth
                      key: client_secret
        ext-authz-token-exchange-e2e:
          namespace: ext-authz-token-exchange-e2e
          helm:
            releaseName: ext-authz-token-exchange-e2e
            chart:
              name: ./charts/ext-authz-token-exchange-e2e
            values:
              gatewayProvider: ${GATEWAY_PROVIDER}
              host: httpbin.${DEPLOYMENT_DOMAIN}
              namespacePrefix: service
              systemNamespace: ext-authz-token-exchange-e2e
              teamApp:
                gatewayNamespace: ${GATEWAY_NAMESPACE}
              platformRoutes:
                gatewayNamespace: ${GATEWAY_NAMESPACE}
                gatewayName: ${GKE_GATEWAY_NAME}
              demoRoute:
                gatewayNamespace: ${GATEWAY_NAMESPACE}
                gatewayName: ${GKE_GATEWAY_NAME}
              inferencePool:
                gatewayNamespace: ${GATEWAY_NAMESPACE}
                gatewayName: ${GKE_GATEWAY_NAME}
              policy:
                httpbinResourceBase: https://httpbin.${DEPLOYMENT_DOMAIN}
              fakeTokenEndpoint:
                image: ${runtime.images.fake-token-endpoint.image}:${runtime.images.fake-token-endpoint.tag}
                env:
                  OTEL_TRACES_EXPORTER: otlp
                  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
                  OTEL_SERVICE_NAME: fake-token-endpoint
    patches:
      - op: replace
        path: pipelines.deploy.run
        value: |-
          source ./scripts/devspace-pipeline.sh
          devspace_pipeline_deploy
  - name: with-keycloak
    activation:
      - vars:
          KEYCLOAK_ENABLED: "true"
    merge:
      deployments:
        ext-authz-token-exchange:
          helm:
            values:
              issuerProfiles:
                extraProfiles:
                  - name: local-keycloak
                    tokenEndpoint: http://keycloak.ext-authz-token-exchange-e2e.svc.cluster.local:8080/realms/token-exchange-e2e/protocol/openid-connect/token
                    bearerRealm: token-exchange-e2e
                    tokenEndpointAuthMethod: client_secret_basic
                    clientIDSecretRef:
                      name: ext-authz-token-exchange-keycloak-oauth
                      key: client_id
                    clientSecretSecretRef:
                      name: ext-authz-token-exchange-keycloak-oauth
                      key: client_secret
        ext-authz-token-exchange-e2e:
          namespace: ext-authz-token-exchange-e2e
          helm:
            releaseName: ext-authz-token-exchange-e2e
            chart:
              name: ./charts/ext-authz-token-exchange-e2e
            valuesFiles:
              - ./charts/ext-authz-token-exchange-e2e/values-keycloak.yaml
            values:
              fakeTokenEndpoint:
                image: ${runtime.images.fake-token-endpoint.image}:${runtime.images.fake-token-endpoint.tag}
        keycloak:
          namespace: ext-authz-token-exchange-e2e
          helm:
            releaseName: keycloak
            chart:
              name: ./charts/keycloak
            values:
              gatewayProvider: ${GATEWAY_PROVIDER}
              gkeGatewayNamespace: ${GATEWAY_NAMESPACE}
              namespace: ext-authz-token-exchange-e2e
              pluginNamespace: ext-authz-token-exchange
              keycloak:
                externalHost: keycloak.${DEPLOYMENT_DOMAIN}
                externalURL: https://keycloak.${DEPLOYMENT_DOMAIN}
  - name: ext-proc
    merge:
      deployments:
        ext-authz-token-exchange:
          helm:
            values:
              extensionMode: ext_proc
              envoyFilter:
                enabled: true
              authorizationPolicy:
                enabled: false
              gatewayExtAuthzService:
                enabled: false
  - name: inferencepool-test
    merge:
      deployments:
        ext-authz-token-exchange-e2e:
          helm:
            values:
              inferencePool:
                enabled: true
                host: inference.${DEPLOYMENT_DOMAIN}
                weightedOrdinaryHost: weighted-ordinary.${DEPLOYMENT_DOMAIN}
                weightedPoolHost: weighted-pool.${DEPLOYMENT_DOMAIN}
                weightedMixedHost: weighted-mixed.${DEPLOYMENT_DOMAIN}
                twoPoolsAHost: two-pools-a.${DEPLOYMENT_DOMAIN}
                twoPoolsBHost: two-pools-b.${DEPLOYMENT_DOMAIN}
                twoPoolsMixedHost: two-pools-mixed.${DEPLOYMENT_DOMAIN}
  - name: gke
    activation:
      - vars:
          DEVSPACE_CONTEXT: gke_.*
    merge:
      deployments:
        ext-authz-token-exchange:
          namespace: ${GATEWAY_NAMESPACE}
    patches:
      - op: add
        path: localRegistry
        value:
          enabled: false
      - op: replace
        path: deployments.ext-authz-token-exchange.namespace
        value: ${GATEWAY_NAMESPACE}
      - op: add
        path: images.prod.buildKit.args
        value:
          - --platform=linux/amd64
      - op: add
        path: images.dev.buildKit.args
        value:
          - --platform=linux/amd64
      - op: add
        path: images.fake-token-endpoint.buildKit.args
        value:
          - --platform=linux/amd64
      - op: replace
        path: images.prod.image
        value: ${REGISTRY}/${IMAGE_NAME}
      - op: replace
        path: images.fake-token-endpoint.image
        value: ${REGISTRY}/${FAKE_TOKEN_ENDPOINT_IMAGE_NAME}
  - name: gke-platform
    merge:
      deployments:
        ext-authz-token-exchange:
          namespace: ${GKE_GATEWAY_NAMESPACE}
          updateImageTags: false
          helm:
            values:
              image:
                repository: ghcr.io/michaelw/ext-authz-token-exchange
                tag: ${GKE_IMAGE_TAG}
              gatewayProvider: gke-gateway
              extensionMode: ext_proc
              gkeExtProc:
                name: ext-authz-token-exchange
                host: ${GKE_HTTPBIN_HOST}
                failOpen: false
                gateway:
                  name: ${GKE_GATEWAY_NAME}
              gkeAuthz:
                callout:
                  service:
                    name: gateway-ext-authz
                    port: 3000
                    targetPort: grpc-authz-tls
                    appProtocol: HTTP2
                  tls:
                    enabled: true
                    port: 3000
                    secretName: gateway-ext-authz-tls
                    selfSigned:
                      enabled: true
                    backendTLSPolicy:
                      enabled: false
                    certificate:
                      enabled: false
                      dnsNames:
                        - gateway-ext-authz.${GKE_GATEWAY_NAMESPACE}.svc.cluster.local
                  healthCheck:
                    enabled: true
                    port: 3001
                    portSpecification: USE_FIXED_PORT
                  backendPolicy:
                    enabled: false
              oauth:
                createSecret: true
                secretName: ext-authz-token-exchange-fake-issuer-oauth
                clientID: e2e-client
                clientSecret: e2e-secret
                existingSecret:
                  name: ext-authz-token-exchange-fake-issuer-oauth
                  clientIDKey: client_id
                  clientSecretKey: client_secret
              issuerProfiles:
                profiles:
                  - name: fake-issuer
                    tokenEndpoint: http://fake-token-endpoint.${GKE_PLATFORM_NAMESPACE}.svc.cluster.local:8080/token/success
                    bearerRealm: ext-authz-token-exchange-e2e
                    tokenEndpointAuthMethod: client_secret_basic
                    clientIDSecretRef:
                      name: ext-authz-token-exchange-fake-issuer-oauth
                      key: client_id
                    clientSecretSecretRef:
                      name: ext-authz-token-exchange-fake-issuer-oauth
                      key: client_secret
                  - name: local-keycloak
                    tokenEndpoint: http://keycloak.${GKE_PLATFORM_NAMESPACE}.svc.cluster.local:8080/realms/token-exchange-e2e/protocol/openid-connect/token
                    bearerRealm: token-exchange-e2e
                    tokenEndpointAuthMethod: client_secret_basic
                    clientIDSecretRef:
                      name: ext-authz-token-exchange-keycloak-oauth
                      key: client_id
                    clientSecretSecretRef:
                      name: ext-authz-token-exchange-keycloak-oauth
                      key: client_secret
              env:
                TOKEN_EXCHANGE_ALLOW_HTTP_TOKEN_ENDPOINT: "true"
                TOKEN_EXCHANGE_BEARER_REALM: ext-authz-token-exchange-e2e
                TOKEN_EXCHANGE_INSECURE_LOG_TOKENS: "false"
                TOKEN_EXCHANGE_DEFAULT_DENY_UNMATCHED: "false"
                GRPC_LOG_HEALTH_CHECKS: "false"
                OTEL_TRACES_EXPORTER: none
                OTEL_METRICS_EXPORTER: none
        gke-platform-resources:
          namespace: ${GKE_PLATFORM_NAMESPACE}
          updateImageTags: false
          helm:
            releaseName: txe-platform
            chart:
              name: ./charts/ext-authz-token-exchange-e2e
            valuesFiles:
              - ./charts/ext-authz-token-exchange-e2e/values-keycloak.yaml
            values:
              gatewayProvider: gke-gateway
              host: ${GKE_HTTPBIN_HOST}
              namespacePrefix: ${GKE_DEMO_NAMESPACE_PREFIX}
              systemNamespace: ${GKE_PLATFORM_NAMESPACE}
              policy:
                httpbinResourceBase: ${GKE_EXTERNAL_SCHEME}://${GKE_HTTPBIN_HOST}
              fakeTokenEndpoint:
                enabled: true
                image: ghcr.io/michaelw/ext-authz-token-exchange-fake-token-endpoint:${GKE_IMAGE_TAG}
              teamApp:
                enabled: true
                gatewayNamespace: ${GKE_GATEWAY_NAMESPACE}
              platformRoutes:
                enabled: true
                gatewayNamespace: ${GKE_GATEWAY_NAMESPACE}
                gatewayName: ${GKE_GATEWAY_NAME}
                gatewaySectionName: ${GKE_GATEWAY_SECTION_NAME}
                host: ${GKE_HTTPBIN_HOST}
                teamNames: ${GKE_PLATFORM_TEAMS}
                teamNamespacePrefix: ${GKE_TEAM_NAMESPACE_PREFIX}
                teamPathRoot: ${GKE_TEAM_PATH_ROOT}
              demoRoute:
                enabled: true
                gatewayNamespace: ${GKE_GATEWAY_NAMESPACE}
                gatewayName: ${GKE_GATEWAY_NAME}
                gatewaySectionName: ${GKE_GATEWAY_SECTION_NAME}
                host: ${GKE_HTTPBIN_HOST}
                pathPrefix: /anything
                backendNamespace: ${GKE_DEMO_NAMESPACE_PREFIX}-yellow
              unselectedNamespaces:
                - ${GKE_DEMO_NAMESPACE_PREFIX}-black
        gke-platform-keycloak:
          namespace: ${GKE_PLATFORM_NAMESPACE}
          helm:
            releaseName: keycloak
            chart:
              name: ./charts/keycloak
            values:
              gatewayProvider: gke-gateway
              gkeGatewayNamespace: ${GKE_GATEWAY_NAMESPACE}
              namespace: ${GKE_PLATFORM_NAMESPACE}
              pluginNamespace: ${GKE_GATEWAY_NAMESPACE}
              keycloak:
                externalHost: ${GKE_KEYCLOAK_HOST}
                externalURL: ${GKE_EXTERNAL_SCHEME}://${GKE_KEYCLOAK_HOST}
              gateway:
                name: ${GKE_GATEWAY_NAME}
                sectionName: ${GKE_GATEWAY_SECTION_NAME}
                routeNamespace: ${GKE_GATEWAY_NAMESPACE}
                createReferenceGrant: true
                httpRedirect:
                  forceDisabled: true
              gkeIap:
                forceDisabled: true
        gke-platform-yellow:
          namespace: ${GKE_TEAM_NAMESPACE_PREFIX}-yellow
          helm:
            releaseName: txe-team-yellow
            chart:
              name: ./charts/ext-authz-token-exchange-e2e
            values:
              gatewayProvider: gke-gateway
              host: ${GKE_HTTPBIN_HOST}
              namespacePrefix: ${GKE_TEAM_NAMESPACE_PREFIX}
              systemNamespace: ${GKE_PLATFORM_NAMESPACE}
              policy:
                httpbinResourceBase: ${GKE_EXTERNAL_SCHEME}://${GKE_HTTPBIN_HOST}
              fakeTokenEndpoint:
                enabled: false
              teamApp:
                enabled: true
                gatewayNamespace: ${GKE_GATEWAY_NAMESPACE}
              platformRoutes:
                enabled: false
              teams:
                - color: yellow
                  namespace: ${GKE_TEAM_NAMESPACE_PREFIX}-yellow
                  scope: yellow
                  pathPrefix: "${GKE_TEAM_PATH_ROOT}/yellow"
                  audiences: ["httpbin-yellow"]
                  scenarios:
                    - name: keycloak-audience
                      scope: profile
                      pathPrefix: "${GKE_TEAM_PATH_ROOT}/yellow/keycloak"
                      issuerRef: local-keycloak
                      resources: []
                      audiences: ["tx-audience-client"]
    patches:
      - op: remove
        path: deployments.ext-authz-token-exchange-e2e
      - op: replace
        path: pipelines.deploy.run
        value: |-
          source ./scripts/devspace-pipeline.sh
          devspace_pipeline_deploy_gke_platform
  - name: gke-app
    merge:
      deployments:
        gke-team-app:
          namespace: ${GKE_TEAM_NAMESPACE}
          helm:
            releaseName: txe-team-${GKE_TEAM_NAME}
            chart:
              name: ./charts/ext-authz-token-exchange-e2e
            values:
              gatewayProvider: gke-gateway
              host: ${GKE_HTTPBIN_HOST}
              namespacePrefix: ${GKE_TEAM_NAMESPACE_PREFIX}
              systemNamespace: ${GKE_PLATFORM_NAMESPACE}
              policy:
                httpbinResourceBase: ${GKE_EXTERNAL_SCHEME}://${GKE_HTTPBIN_HOST}
              fakeTokenEndpoint:
                enabled: false
              teamApp:
                enabled: true
                gatewayNamespace: ${GKE_GATEWAY_NAMESPACE}
              platformRoutes:
                enabled: false
              teams:
                - color: ${GKE_TEAM_NAME}
                  namespace: ${GKE_TEAM_NAMESPACE}
                  scope: ${GKE_TEAM_NAME}
                  pathPrefix: "${GKE_TEAM_PATH_ROOT}/${GKE_TEAM_NAME}"
                  audiences: ["httpbin-${GKE_TEAM_NAME}"]
                  scenarios:
                    - name: keycloak-audience
                      scope: profile
                      pathPrefix: "${GKE_TEAM_PATH_ROOT}/${GKE_TEAM_NAME}/keycloak"
                      issuerRef: local-keycloak
                      resources: []
                      audiences: ["tx-audience-client"]
    patches:
      - op: remove
        path: deployments.ext-authz-token-exchange
      - op: remove
        path: deployments.ext-authz-token-exchange-e2e
      - op: replace
        path: pipelines.deploy.run
        value: |-
          source ./scripts/devspace-pipeline.sh
          devspace_pipeline_deploy_gke_app
  - name: managed-gke-gateway
    activation:
      - vars:
          GATEWAY_PROVIDER: gke-gateway
          GKE_MANAGE_GATEWAY: "true"
    merge:
      deployments:
        gateway-integration:
          namespace: ${GATEWAY_NAMESPACE}
          helm:
            releaseName: txe-gateway-integration
            chart:
              name: ./charts/gateway-development
            values:
              host: httpbin.${DEPLOYMENT_DOMAIN}
              name: ${GKE_GATEWAY_NAME}
            upgradeArgs: ["--wait", "--timeout=600s"]
  - name: apigee
    activation:
      - vars:
          GATEWAY_PROVIDER: apigee
    replace:
      dependencies: {}
      deployments:
        ext-authz-token-exchange:
          namespace: ${APIGEE_NAMESPACE}
          updateImageTags: false
          helm:
            releaseName: ${APIGEE_RELEASE}
            chart:
              name: ./charts/ext-authz-token-exchange
            valuesFiles: ["${APIGEE_PLUGIN_VALUES}"]
            values:
              image:
                repository: ${runtime.images.prod.image}
                tag: ${runtime.images.prod.tag}
              env:
                TOKEN_EXCHANGE_BEARER_REALM: ext-authz-token-exchange-e2e
            upgradeArgs: ["--wait", "--timeout=600s"]
        ext-authz-token-exchange-e2e:
          namespace: ${APIGEE_SYSTEM_NAMESPACE}
          updateImageTags: false
          helm:
            releaseName: ${APIGEE_DEMO_RELEASE}
            chart:
              name: ./charts/ext-authz-token-exchange-e2e
            valuesFiles: ["${APIGEE_DEMO_VALUES}"]
            values:
              fakeTokenEndpoint:
                image: ${runtime.images.fake-token-endpoint.image}:${runtime.images.fake-token-endpoint.tag}
            upgradeArgs: ["--wait", "--timeout=600s"]
        keycloak:
          namespace: ${APIGEE_SYSTEM_NAMESPACE}
          helm:
            releaseName: ${APIGEE_KEYCLOAK_RELEASE}
            chart:
              name: ./charts/keycloak
            valuesFiles: ["${APIGEE_KEYCLOAK_VALUES}"]
            upgradeArgs: ["--wait", "--timeout=600s"]
    patches:
      - op: replace
        path: pipelines.deploy.run
        value: |-
          python3 scripts/gateway.py preflight
          ensure_pull_secrets --all
          build_images prod fake-token-endpoint
          python3 scripts/gateway.py fixtures
          if [ "${APIGEE_KEYCLOAK_DISABLED}" = false ]; then
            create_deployments keycloak
          fi
          if [ "${APIGEE_FIXTURES_DISABLED}" = false ]; then
            create_deployments ext-authz-token-exchange-e2e
          fi
          create_deployments ext-authz-token-exchange
          python3 scripts/gateway.py proxy
      - op: replace
        path: pipelines.dev.run
        value: |-
          python3 scripts/gateway.py preflight
          ensure_pull_secrets --all
          build_images dev
          start_dev --all --set terminal.enabled=false --set logs.enabled=true
      - op: remove
        path: dev.ext-authz-token-exchange.imageSelector
      - op: add
        path: dev.ext-authz-token-exchange.labelSelector
        value:
          app.kubernetes.io/instance: ${APIGEE_RELEASE}
          app.kubernetes.io/name: ext-authz-token-exchange
      - op: add
        path: dev.ext-authz-token-exchange.namespace
        value: ${APIGEE_NAMESPACE}
      - op: replace
        path: dev.ext-authz-token-exchange.persistPaths
        value: []
      - op: replace
        path: dev.ext-authz-token-exchange.resources
        value:
          requests:
            cpu: "1"
            memory: 4Gi
            ephemeral-storage: 4Gi
          limits:
            cpu: "1"
            memory: 4Gi
            ephemeral-storage: 4Gi
      - op: replace
        path: dev.ext-authz-token-exchange.env
        value:
          - name: GOMAXPROCS
            value: "2"
          - name: GOFLAGS
            value: -p=2
          - name: GOPATH
            value: /tmp/go
          - name: GOCACHE
            value: /tmp/go-cache
          - name: GOMODCACHE
            value: /tmp/go-mod
      - op: add
        path: dev.ext-authz-token-exchange.sync[0].disableDownload
        value: true
      - op: remove
        path: dev.ext-authz-token-exchange.sync[1]
      - op: replace
        path: dev.ext-authz-token-exchange.command
        value: ["/entrypoint.sh"]
      - op: replace
        path: dev.ext-authz-token-exchange.patches
        value:
          - op: remove
            path: spec.containers[*].livenessProbe
          - op: replace
            path: spec.containers[*].securityContext.readOnlyRootFilesystem
            value: false
          - op: replace
            path: spec.containers[*].securityContext.runAsUser
            value: 1000
          - op: replace
            path: spec.containers[*].resources
            value:
              requests:
                cpu: "1"
                memory: 4Gi
                ephemeral-storage: 4Gi
              limits:
                cpu: "1"
                memory: 4Gi
                ephemeral-storage: 4Gi
      - op: replace
        path: images.dev.skipPush
        value: false
      - op: replace
        path: pipelines.purge.run
        value: |-
          stop_dev --all
          echo 'Stopped development. Use explicit cleanup commands to remove owned resources.'

  - name: apigee-without-fixtures
    activation:
      - vars:
          GATEWAY_PROVIDER: apigee
          APIGEE_FIXTURES_DISABLED: "true"
    patches:
      - op: remove
        path: deployments.ext-authz-token-exchange-e2e
      - op: remove
        path: deployments.keycloak
  - name: apigee-without-keycloak
    activation:
      - vars:
          GATEWAY_PROVIDER: apigee
          APIGEE_FIXTURES_DISABLED: "false"
          APIGEE_KEYCLOAK_DISABLED: "true"
    patches:
      - op: remove
        path: deployments.keycloak

  - name: configured-gateway
    activation:
      - vars:
          GATEWAY_SETUP_PROVIDER: (apigee|gke-gateway)
    replace:
      dependencies: {}

# Images to build and push
images:
  # Development image - not pushed to production registry
  dev:
    image: ${DEV_REGISTRY}/${IMAGE_NAME}-dev
    dockerfile: ./Dockerfile
    target: dev
    buildKit: &buildKit
      {}
    tags:
      - ${DEV_TAG}
      - dev
    skipPush: true # Never push dev images to registry

  # Production image - for deployment and dependencies
  prod:
    image: ${REGISTRY}/${IMAGE_NAME}
    dockerfile: ./Dockerfile
    target: prod
    buildKit: *buildKit
    tags:
      - "${IMAGE_TAG}"
      - ${PROD_TAG}
    # This will be pushed to registry for others to use

  fake-token-endpoint:
    image: ${REGISTRY}/${FAKE_TOKEN_ENDPOINT_IMAGE_NAME}
    dockerfile: ./Dockerfile
    target: fake-token-endpoint
    buildKit: *buildKit
    tags:
      - "${IMAGE_TAG}"
      - ${PROD_TAG}

# Deployments - Kubernetes manifests
deployments:
  ext-authz-token-exchange:
    namespace: ext-authz-token-exchange
    updateImageTags: false
    helm:
      releaseName: ext-authz-token-exchange
      chart:
        name: ./charts/ext-authz-token-exchange
      values:
        image:
          repository: ${runtime.images.prod.image}
          tag: ${runtime.images.prod.tag}
        env:
          GRPC_LOG_HEALTH_CHECKS: "false"
          OTEL_TRACES_EXPORTER: otlp
          OTEL_METRICS_EXPORTER: otlp
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
          OTEL_SERVICE_NAME: ext-authz-token-exchange
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi

# Development configuration
dev:
  ext-authz-token-exchange:
    imageSelector: ${REGISTRY}/${IMAGE_NAME}
    devImage: ${runtime.images.dev.image}:${runtime.images.dev.tag}

    env: []

    resources:
      requests:
        cpu: 1000m
        memory: 1024Mi

    # Patch Kubernetes resources last-mile
    patches:
      # Override security context for development
      - op: add
        path: spec.containers[*].securityContext.allowPrivilegeEscalation
        value: true

    # Sync local files to container
    sync:
      - path: ./
        excludePaths: [".git", ".devspace", "bin", "output", ".playwright-cli", "infra/**/.terraform", "infra/**/*.tfstate*", "node_modules"]
        startContainer: true
      - path: "${DEVSPACE_USER_HOME}/.gitconfig:${CONTAINER_USER_HOME}/.gitconfig"
        file: true
        disableDownload: true

    # Port forwarding for development
    ports:
      - port: "3001" # gRPC ext-authz service

    persistPaths:
    - path: /go-cache
      skipPopulate: true
      # Optional path on the persistent volume to mount
      # volumePath: my-volume/app

    ssh:
      localHostname: ${DEVSPACE_NAME}.devspace

    proxyCommands:
      - gitCredentials: true
      - command: kubectl

    workingDir: /workspaces/${DEVSPACE_NAME}

    terminal:
      command: bash .devcontainer/start.sh

    command: ["/entrypoint.sh"]
    args: ["air"]

    restartHelper:
      inject: true

pipelines:
  remove-owned-applications:
    run: |-
      python3 scripts/gateway.py cleanup-check
      helm --kube-context "${DEVSPACE_CONTEXT}" -n "${APIGEE_SYSTEM_NAMESPACE}" uninstall "${APIGEE_KEYCLOAK_RELEASE}" --ignore-not-found --wait --timeout 10m
      helm --kube-context "${DEVSPACE_CONTEXT}" -n "${APIGEE_SYSTEM_NAMESPACE}" uninstall "${APIGEE_DEMO_RELEASE}" --ignore-not-found --wait --timeout 10m
      helm --kube-context "${DEVSPACE_CONTEXT}" -n "${APIGEE_NAMESPACE}" uninstall "${APIGEE_RELEASE}" --ignore-not-found --wait --timeout 10m
  plugin-only:
    run: |-
      python3 scripts/gateway.py preflight
      create_deployments ext-authz-token-exchange

  cleanup-fixtures:
    run: |-
      python3 scripts/gateway.py cleanup-check
      if [ "${GATEWAY_PROVIDER}" = apigee ]; then
        helm --kube-context "${DEVSPACE_CONTEXT}" -n "${APIGEE_SYSTEM_NAMESPACE}" uninstall "${APIGEE_KEYCLOAK_RELEASE}" --ignore-not-found --wait --timeout 10m
        helm --kube-context "${DEVSPACE_CONTEXT}" -n "${APIGEE_SYSTEM_NAMESPACE}" uninstall "${APIGEE_DEMO_RELEASE}" --ignore-not-found --wait --timeout 10m
      else
        purge_deployments keycloak ext-authz-token-exchange-e2e
      fi
  purge:
    run: |-
      stop_dev --all
      purge_deployments --all
  # Pipeline for development
  dev:
    flags:
    - name: logs
      short: l
    - name: vscode
    run: |-
      LOGS_ENABLED=false
      TERMINAL_ENABLED=true
      if [ $(get_flag "logs") == "true" ]; then
        LOGS_ENABLED=true
        TERMINAL_ENABLED=false
      fi

      run_dependencies --all
      ensure_pull_secrets --all
      build_images dev
      create_deployments --all
      start_dev --all --set "terminal.enabled=$TERMINAL_ENABLED" --set "logs.enabled=$LOGS_ENABLED"
      if [ $(get_flag "vscode") == "true" ]; then
        code --folder-uri vscode-remote://ssh-remote+${DEVSPACE_NAME}.devspace/workspaces/${DEVSPACE_NAME}
      fi

  # Pipeline for regular deployment
  deploy:
    run: |-
      run_dependencies --all
      ensure_pull_secrets --all
      build_images prod
      helm dependency build charts/ext-authz-token-exchange
      create_deployments --all

commands:
  # sections:
  #   build:
  #     Commands that can be executed in a dev container
  #   images:
  #     Commands related to building and pushing Docker images
  #   deploy:
  #     Commands related to deploying the service to Kubernetes
  setup:
    description: "Set up the selected gateway and infrastructure"
    section: build
    command: python3 scripts/gateway.py setup "$@"

  setup-tools:
    description: "Install debugger and reload tools inside the development container"
    command: |
      go install github.com/go-delve/delve/cmd/dlv@v1.26.3
      go install github.com/air-verse/air@v1.65.1

  preflight:
    command: python3 scripts/gateway.py preflight "$@"

  diagnostics:
    command: python3 scripts/gateway.py diagnostics "$@"

  renew-certificates:
    command: python3 scripts/gateway.py renew-certificates "$@"

  repeatability:
    command: python3 scripts/gateway.py repeatability "$@"

  cleanup-fixtures:
    command: devspace run-pipeline cleanup-fixtures

  undeploy-proxy:
    command: python3 scripts/gateway.py undeploy-proxy "$@"

  rollback-proxy:
    command: python3 scripts/gateway.py rollback "$@"

  delete-proxy-resources:
    command: python3 scripts/gateway.py delete-proxy-resources "$@"

  destroy-infrastructure:
    command: python3 scripts/gateway.py destroy-infrastructure "$@"

  destroy-environment:
    command: python3 scripts/gateway.py destroy-environment "$@"

  log-format:
    command: python3 scripts/gateway.py log-format "$@"

  inspect-on:
    command: python3 scripts/gateway.py inspect-on "$@"

  inspect-off:
    command: python3 scripts/gateway.py inspect-off "$@"

  test-logging:
    command: python3 scripts/gateway.py test-logging "$@"

  debug:
    command: python3 scripts/gateway.py debug "$@"

  stop:
    command: devspace reset pods

  generate:
    description: "Generate required code and download dependencies"
    section: build
    command: |
      echo "I: target=generate"
      go mod download
      go generate ./...

  compile:
    description: "Compile the code base"
    section: build
    command: |
      echo "I: target=compile"
      go mod download
      go generate ./...
      go build -v ./cmd/...

  build:
    description: "Build all commands"
    section: build
    command: |
      echo "I: target=build"
      go mod download
      go generate ./...
      go build ./cmd/...

  test:
    description: "Run all tests"
    section: build
    command: |
      echo "I: target=test"
      go mod download
      go generate ./...
      go test -v ./...

  coverage:
    description: "Run Go tests with coverage"
    section: build
    command: |
      echo "I: target=coverage"
      go generate ./...
      go test -coverprofile=coverage.out ./...

  actionlint:
    description: "Lint GitHub Actions workflows"
    section: build
    command: |
      echo "I: target=actionlint"
      go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  lint:
    description: "Run repository lint checks"
    section: build
    command: |
      echo "I: target=lint"
      pre-commit run --all-files
      go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  helm-verify:
    description: "Verify Helm chart dependencies, lint, and rendering"
    section: build
    command: |
      echo "I: target=helm-verify"
      helm dependency build charts/ext-authz-token-exchange
      helm dependency build charts/keycloak
      helm lint charts/ext-authz-token-exchange
      helm lint charts/ext-authz-token-exchange-e2e
      helm lint charts/keycloak
      helm unittest --strict charts/ext-authz-token-exchange charts/ext-authz-token-exchange-e2e charts/keycloak
      helm template ext-authz-token-exchange charts/ext-authz-token-exchange \
        --namespace ext-authz-token-exchange \
        > /tmp/ext-authz-token-exchange-rendered.yaml
      helm template ext-authz-token-exchange-e2e charts/ext-authz-token-exchange-e2e \
        --namespace ext-authz-token-exchange-e2e \
        > /tmp/ext-authz-token-exchange-e2e-rendered.yaml
      ./scripts/verify-gke-deployment-model.sh
      ./scripts/verify-ext-proc-filter.sh

  verify:
    description: "Run CI-equivalent local validation without a Kubernetes cluster"
    section: build
    command: |
      echo "I: target=verify"
      echo "I: target=lint"
      pre-commit run --all-files
      go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      echo "I: target=coverage"
      go mod download
      go generate ./...
      go test -coverprofile=coverage.out ./...
      CGO_ENABLED=1 go test -race ./...
      go vet ./...
      node --test cmd/demo-dashboard/token_refresh_test.cjs
      python3 -m unittest discover -s scripts -p '*_test.py'
      echo "I: target=helm-verify"
      helm dependency build charts/ext-authz-token-exchange
      helm dependency build charts/keycloak
      helm lint charts/ext-authz-token-exchange
      helm lint charts/ext-authz-token-exchange-e2e
      helm lint charts/keycloak
      helm unittest --strict charts/ext-authz-token-exchange charts/ext-authz-token-exchange-e2e charts/keycloak
      helm template ext-authz-token-exchange charts/ext-authz-token-exchange \
        --namespace ext-authz-token-exchange \
        > /tmp/ext-authz-token-exchange-rendered.yaml
      helm template ext-authz-token-exchange-e2e charts/ext-authz-token-exchange-e2e \
        --namespace ext-authz-token-exchange-e2e \
        > /tmp/ext-authz-token-exchange-e2e-rendered.yaml
      ./scripts/verify-gke-deployment-model.sh
      ./scripts/verify-ext-proc-filter.sh

  smoke:
    description: "Deploy the selected provider test stack and run Kubernetes e2e smoke tests"
    section: build
    command: |
      echo "I: target=smoke"
      if [ "$GATEWAY_PROVIDER" = apigee ]; then
        python3 scripts/gateway.py smoke "$@"
        exit $?
      fi
      if printf '%s' "${DEVSPACE_PROFILES:-}" | grep -q 'gke-platform'; then
        source ./scripts/devspace-pipeline.sh
        export_gke_command_environment
        ./scripts/run-gke-smoke.sh "$@"
      else
        devspace deploy
        E2E_BASE_URL="https://httpbin.$DEPLOYMENT_DOMAIN" devspace run test-e2e $@
      fi

  test-e2e:
    description: "Run Kubernetes e2e tests against the selected test stack"
    section: build
    command: |
      echo "I: target=test-e2e"
      if [ "$GATEWAY_PROVIDER" = apigee ]; then
        python3 scripts/gateway.py test-e2e "$@"
        exit $?
      fi
      LABEL_FILTER_ARGS=""
      case " $* " in
        *"--label-filter"*) ;;
        *) LABEL_FILTER_ARGS="--label-filter=!stress" ;;
      esac
      if [ "${DEVSPACE_CONTEXT#gke_}" != "$DEVSPACE_CONTEXT" ] && [ -z "${E2E_NAMESPACE:-}" ]; then
        E2E_NAMESPACE="${GATEWAY_NAMESPACE}"
        export E2E_NAMESPACE
      fi
      E2E_BASE_URL="${E2E_BASE_URL:-https://httpbin.$DEPLOYMENT_DOMAIN}" \
      E2E_KEYCLOAK_BASE_URL="${E2E_KEYCLOAK_BASE_URL:-https://keycloak.$DEPLOYMENT_DOMAIN}" \
      E2E_KEYCLOAK_ISSUER="${E2E_KEYCLOAK_ISSUER:-https://keycloak.$DEPLOYMENT_DOMAIN/realms/token-exchange-e2e}" \
      E2E_SKIP_INSTALL="${E2E_SKIP_INSTALL:-true}" \
      python3 scripts/developer.py e2e $LABEL_FILTER_ARGS "$@"

  gke-smoke:
    description: "Deploy the GKE test stack and run Kubernetes e2e smoke tests"
    section: build
    command: |
      echo "I: target=gke-smoke"
      devspace run smoke $@

  stress-e2e:
    description: "Deploy the selected provider test stack and run the small opt-in Kubernetes e2e stress test"
    section: build
    command: |
      echo "I: target=stress-e2e"
      devspace deploy
      devspace run test-e2e --label-filter=stress "$@"

  demo-dashboard:
    description: "Start the local token exchange demo dashboard"
    section: build
    command: |
      echo "I: target=demo-dashboard"
      if printf '%s' "${DEVSPACE_PROFILES:-}" | grep -q 'gke-platform'; then
        source ./scripts/devspace-pipeline.sh
        export_gke_command_environment
        export DEMO_BASE_URL="$GKE_COMMAND_HTTPBIN_URL"
        export DEMO_KEYCLOAK_BASE_URL="$GKE_COMMAND_KEYCLOAK_URL"
        export DEMO_KEYCLOAK_ISSUER="$GKE_COMMAND_KEYCLOAK_URL/realms/token-exchange-e2e"
        export DEMO_DIRECT_ADDRESS="$GKE_COMMAND_DIRECT_ADDRESS"
        export DEMO_NAMESPACE_PREFIX="$GKE_DEMO_NAMESPACE_PREFIX"
        export DEMO_SYSTEM_NAMESPACE="$GKE_PLATFORM_NAMESPACE"
        export DEMO_PLUGIN_NAMESPACE="$GKE_GATEWAY_NAMESPACE"
      else
        DEMO_PLUGIN_NAMESPACE="ext-authz-token-exchange"
        if [ "$GATEWAY_PROVIDER" = "gke-gateway" ]; then
          DEMO_PLUGIN_NAMESPACE="$GATEWAY_NAMESPACE"
        fi
      fi
      DEMO_BASE_URL="${DEMO_BASE_URL:-https://httpbin.$DEPLOYMENT_DOMAIN}" \
      DEMO_KEYCLOAK_BASE_URL="${DEMO_KEYCLOAK_BASE_URL:-https://keycloak.$DEPLOYMENT_DOMAIN}" \
      DEMO_KEYCLOAK_ISSUER="${DEMO_KEYCLOAK_ISSUER:-https://keycloak.$DEPLOYMENT_DOMAIN/realms/token-exchange-e2e}" \
      DEMO_PLUGIN_NAMESPACE="${DEMO_PLUGIN_NAMESPACE}" \
        ./scripts/run-demo-dashboard.sh $@

  start:
    description: "Start the application"
    section: build
    command: |
      echo "I: target=start"
      if ! pgrep air >/dev/null; then
        go run ./cmd/ext-authz-token-exchange-service $@
      else
        echo "I: using air, nothing to do here"
      fi

  build-images:
    description: "Build Docker images for development and production environments"
    section: images
    command: |
      devspace build $@

  deploy:
    description: "Deploy the service to Kubernetes"
    section: deploy
    command: |
      devspace deploy $@

  dev:
    description: "Start development environment"
    section: deploy
    command: |
      devspace dev $@

  helm:
    description: "Run Helm commands"
    section: deploy
    command: |
      helm $@

  k:
    description: "Run kubectl commands"
    section: deploy
    command: |
      kubectl $@

  k9s:
    description: "Run k9s, the Kubernetes terminal UI"
    section: deploy
    command: |
      k9s $@

  logs:
    description: "View logs from the deployed service pods"
    section: deploy
    command: |
      devspace logs $@
