suite: dedicated GKE development gateway
templates:
  - templates/gateway.yaml
tests:
  - it: creates exactly a gateway and its TLS secret
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.gatewayClassName
          value: gke-l7-regional-external-managed
        documentIndex: 0
      - equal:
          path: spec.listeners[1].tls.certificateRefs[0].name
          value: txe-gateway-tls
        documentIndex: 0
      - equal:
          path: type
          value: kubernetes.io/tls
        documentIndex: 1
